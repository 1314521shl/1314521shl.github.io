<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机数字小游戏</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#f5f7fa;padding:16px}
.box{max-width:420px;margin:0 auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 12px #00000015}
.title{text-align:center;font-size:20px;margin-bottom:16px;font-weight:bold}
.ball-group{display:flex;gap:10px;justify-content:center;margin:16px 0}
.ball{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:bold}
.red{background:#e63946}
.blue{background:#457b9d}
.info{text-align:center;margin:12px 0;color:#444}
.btn{width:100%;padding:12px;border:none;background:#2563eb;color:#fff;border-radius:10px;font-size:16px;margin:10px 0}
table{width:100%;border-collapse:collapse;margin-top:16px}
th,td{border:1px solid #ddd;padding:8px;text-align:center;font-size:14px}
th{background:#f1f5f9}
.tip{margin-top:14px;padding:12px;background:#fffbeb;border-radius:10px;color:#92400e}
</style>
</head>
<body>
<div class="box">
  <div class="title">随机数字小游戏</div>
    <div class="info">回合编号：<span id="qishu">0000001</span></div>
      <div class="ball-group" id="ballWrap"></div>
        <div class="tip">随机组合：<span id="tx">A、B、C</span>｜备选数字：<span id="tm">03 07 12</span></div>
          <button class="btn" onclick="next()">下一回合</button>
            <button class="btn" onclick="resetAll()">重置</button>
              <table>
                  <thead>
                        <tr><th>回合号</th><th>数字组</th><th>随机组合</th></tr>
                            </thead>
                                <tbody id="history"></tbody>
                                  </table>
                                  </div>
                                  <script>
                                  let data = [{q:"0000001",num:[1,5,12,18,22,30,7],group:"A、B、C",alt:"03 07 12"}];
                                  let idx = 0;
                                  const ballWrap=document.getElementById("ballWrap");
                                  const qishu=document.getElementById("qishu");
                                  const tx=document.getElementById("tx");
                                  const tm=document.getElementById("tm");
                                  const history=document.getElementById("history");

                                  function render(){
                                    let d=data[idx];
                                      qishu.innerText=d.q;
                                        tx.innerText=d.group;
                                          tm.innerText=d.alt;
                                            ballWrap.innerHTML="";
                                              d.num.forEach((v,i)=>{
                                                  let b=document.createElement("div");
                                                      b.className="ball "+(i<6?"red":"blue");
                                                          b.innerText=v;
                                                              ballWrap.appendChild(b);
                                                                })
                                                                  renderHistory();
                                                                  }
                                                                  function renderHistory(){
                                                                    history.innerHTML="";
                                                                      data.forEach(d=>{
                                                                          let tr=document.createElement("tr");
                                                                              tr.innerHTML=`<td>${d.q}</td><td>${d.num.join(" ")}</td><td>${d.group}</td>`;
                                                                                  history.appendChild(tr);
                                                                                    })
                                                                                    }
                                                                                    function next(){
                                                                                      let last=Number(data[data.length-1].q);
                                                                                        let newQ=String(last+1);
                                                                                          while(newQ.length<7) newQ="0"+newQ;
                                                                                            let nums=[];
                                                                                              while(nums.length<6){
                                                                                                  let r=Math.floor(Math.random()*33)+1;
                                                                                                      if(!nums.includes(r)) nums.push(r);
                                                                                                        }
                                                                                                          nums.sort((a,b)=>a-b);
                                                                                                            nums.push(Math.floor(Math.random()*16)+1);
                                                                                                              let words=["A","B","C","D","E","F","G","H","I","J","K","L"];
                                                                                                                let sx=[];
                                                                                                                  while(sx.length<3){
                                                                                                                      let r=words[Math.floor(Math.random()*12)];
                                                                                                                          if(!sx.includes(r)) sx.push(r);
                                                                                                                            }
                                                                                                                              let ms=[];
                                                                                                                                while(ms.length<3){
                                                                                                                                    let r=String(Math.floor(Math.random()*33)+1);
                                                                                                                                        if(r.length<2) r="0"+r;
                                                                                                                                            if(!ms.includes(r)) ms.push(r);
                                                                                                                                              }
                                                                                                                                                data.push({q:newQ,num:nums,group:sx.join("、"),alt:ms.join(" ")});
                                                                                                                                                  idx=data.length-1;
                                                                                                                                                    render();
                                                                                                                                                    }
                                                                                                                                                    function resetAll(){
                                                                                                                                                      data=[{q:"0000001",num:[1,5,12,18,22,30,7],group:"A、B、C",alt:"03 07 12"}];
                                                                                                                                                        idx=0;
                                                                                                                                                          render();
                                                                                                                                                          }
                                                                                                                                                          render();
                                                                                                                                                          </script>
                                                                                                                                                          </body>
                                                                                                                                                          </html>
